name: CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:

# =========================
# JOB 1: Code Quality
# =========================
  code-quality:
    name: Code Quality Check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.1'
          extensions: mbstring, xml, ctype, json, tokenizer
          coverage: none

      - name: Install Composer dependencies
        run: |
          if [ -f "composer.json" ]; then
            composer install --prefer-dist --no-progress
          else
            echo "No composer.json found"
          fi

      - name: PHP Syntax Check
        run: |
          find . -name "*.php" -not -path "./vendor/*" -exec php -l {} \;

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install Node dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci
          else
            echo "No package.json found"
          fi


# =========================
# JOB 2: Build + Package + Deploy (No Artifacts)
# =========================
  build-deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest
    needs: code-quality
    if: github.ref == 'refs/heads/main'

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '18'

      - name: Install dependencies
        run: |
          if [ -f "package.json" ]; then
            npm ci
          fi

      - name: Build assets
        run: |
          if [ -f "package.json" ]; then
            npm run build || echo "No build script"
          fi

      - name: Create clean package
        run: |
          mkdir deploy-package
          rsync -av . deploy-package/ \
            --exclude .git \
            --exclude .github \
            --exclude node_modules \
            --exclude deploy-package \
            --exclude '*.map' \
            --exclude README.md \
            --exclude package.json \
            --exclude package-lock.json \
            --exclude composer.json \
            --exclude composer.lock

      - name: Deploy via FTP/SFTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.STAGING_FTP_SERVER }}
          username: ${{ secrets.STAGING_FTP_USERNAME }}
          password: ${{ secrets.STAGING_FTP_PASSWORD }}
          local-dir: deploy-package/
          server-dir: /wp-content/themes/docy/
          dangerous-clean-slate: false
          timeout: 300000
          log-level: verbose

      - name: Success Message
        if: success()
        run: echo "✅ Production deployment successful!"

      - name: Failure Message
        if: failure()
        run: echo "❌ Production deployment failed!"
